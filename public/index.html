<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Aço CPRT</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E1A2B">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: cabeçalho escuro fixo, coluna única de trabalho, navegação inferior. */
:root{
  --font-d:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-b:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg:#EDF0F3; --surface:#FFFFFF; --surface2:#F3F5F8; --ink:#0E1A2B; --muted:#586577; --line:#D3D9E1;
  --hdr:#0E1A2B; --hdr-ink:#F2F5F9; --accent:#F2A900; --accent-ink:#1A1300;
  --primary:#16355F; --primary-ink:#FFFFFF;
  --ret:#B5520A; --ret-bg:#FCEFE3; --mob:#1C5DB8; --mob-bg:#E5EEFB;
  --ok:#1B8A4B; --ok-bg:#E3F4EA; --bad:#C62F2F; --bad-bg:#FBE8E8;
  --shadow:0 1px 2px rgba(14,26,43,.06),0 4px 14px rgba(14,26,43,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A121E; --surface:#121D2D; --surface2:#182638; --ink:#E8EDF3; --muted:#93A0B2; --line:#26374D;
    --hdr:#070D16; --primary:#3B7BD0; --primary-ink:#FFFFFF;
    --ret:#F0914A; --ret-bg:#2B1D12; --mob:#7AB0F4; --mob-bg:#14243A;
    --ok:#4CC27E; --ok-bg:#12281D; --bad:#F27B7B; --bad-bg:#2D1717;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A121E; --surface:#121D2D; --surface2:#182638; --ink:#E8EDF3; --muted:#93A0B2; --line:#26374D;
  --hdr:#070D16; --primary:#3B7BD0; --primary-ink:#FFFFFF;
  --ret:#F0914A; --ret-bg:#2B1D12; --mob:#7AB0F4; --mob-bg:#14243A;
  --ok:#4CC27E; --ok-bg:#12281D; --bad:#F27B7B; --bad-bg:#2D1717;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{min-height:100%;display:flex;flex-direction:column}
header.top{background:var(--hdr);color:var(--hdr-ink);padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--accent)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top-in.is-login{justify-content:center}
.top-in.is-login .grow{flex:0 1 auto}
.top-in.is-login .sub{display:none}
.mark{width:40px;height:40px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-d);font-weight:700;font-size:20px;letter-spacing:.02em;flex:none}
.top h1{margin:0;font-family:var(--font-d);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1.05}
.top .sub{font-size:12.5px;opacity:.72;margin-top:2px}
.top .grow{flex:1;min-width:0}
.iconbtn{background:transparent;border:1px solid rgba(255,255,255,.22);color:var(--hdr-ink);width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:rgba(255,255,255,.1)}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;gap:6px}
.tab{border:0;background:transparent;border-radius:12px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;position:relative}
.tab[aria-current="page"]{color:var(--primary);background:var(--surface2)}
:root[data-theme="dark"] .tab[aria-current="page"]{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-current="page"]{color:var(--ink)}}
.tab .badge{position:absolute;top:3px;right:calc(50% - 24px);background:var(--accent);color:var(--accent-ink);border-radius:99px;font-size:11px;font-weight:700;padding:0 6px;min-width:18px;text-align:center}
h2.sec{font-family:var(--font-d);font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;font-weight:700;display:flex;align-items:center;gap:8px}
h2.sec .n{background:var(--ink);color:var(--surface);width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:13px;letter-spacing:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:16px}
.ops{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.ops{grid-template-columns:1fr 1fr}}
.op{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);min-height:132px}
.op .tt{font-family:var(--font-d);font-size:28px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.op .dd{color:var(--muted);font-size:14.5px}
.op .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.op.ret .ico{background:var(--ret-bg);color:var(--ret)} .op.ret .tt{color:var(--ret)}
.op.mob .ico{background:var(--mob-bg);color:var(--mob)} .op.mob .tt{color:var(--mob)}
.op.ret:hover,.op.ret:focus-visible{border-color:var(--ret)} .op.mob:hover,.op.mob:focus-visible{border-color:var(--mob)}
.opbar{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);border-left-width:6px}
.opbar.ret{border-left-color:var(--ret)} .opbar.mob{border-left-color:var(--mob)}
.opbar .t{font-family:var(--font-d);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.opbar.ret .t{color:var(--ret)} .opbar.mob .t{color:var(--mob)}
.opbar .s{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;min-height:46px;text-decoration:none}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.acc:hover{filter:brightness(1.05)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.prog{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:13.5px;color:var(--muted);font-weight:600}
.prog .bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
.tiles{display:grid;gap:12px}
.tile{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px;align-items:center}
@media(min-width:560px){.tile{grid-template-columns:132px 1fr}}
.tile.ok{border-color:var(--ok)}
.tile.err{border-color:var(--bad)}
.shot{aspect-ratio:4/3;background:var(--surface2);border-radius:10px;overflow:hidden;position:relative;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line)}
.shot img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.shot .spin{position:absolute}
.tile h3{margin:0 0 3px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px}
.tile p{margin:0 0 8px;font-size:13px;color:var(--muted)}
.chk{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:99px;background:var(--ok);color:#fff}
.chk svg{width:12px;height:12px;stroke-width:3}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
.f{display:flex;flex-direction:column;gap:5px}
.f.full{grid-column:1/-1}
.f.half{grid-column:span 1}
.f label{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--ink)}
.f label .rq{color:var(--bad)}
.f input,.f select,.f textarea{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px;min-height:46px}
.f textarea{min-height:84px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--primary)}
.f.err input,.f.err select,.f.err textarea{border-color:var(--bad);background:var(--bad-bg)}
.f .hint{font-size:12px;color:var(--muted)}
.f .em{font-size:12px;color:var(--bad);font-weight:600}
.plate{font-family:var(--font-d);font-weight:700;font-size:22px;letter-spacing:.12em;text-transform:uppercase}
.calc{background:var(--surface2);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;border:1px solid var(--line)}
.calc .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.calc .v{font-family:var(--font-d);font-size:22px;font-weight:700;line-height:1.1;margin-top:2px}
.calc .u{font-size:11px;font-weight:600;margin-left:2px;color:var(--muted);text-transform:none}
.alert{background:var(--bad-bg);border:1.5px solid var(--bad);color:var(--bad);border-radius:12px;padding:12px 14px;font-size:14px;margin:12px 0}
.alert ul{margin:6px 0 0;padding-left:20px}
.note{background:var(--surface2);border-left:4px solid var(--primary);padding:10px 12px;border-radius:8px;font-size:13px;color:var(--muted)}
.sticky-cta{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));z-index:15;margin-top:16px;display:flex;flex-direction:column;gap:8px}
.done{text-align:center;padding:28px 16px}
.done .big{width:64px;height:64px;border-radius:99px;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px}
.done .big svg{width:36px;height:36px;stroke-width:2.5}
.done h2{font-family:var(--font-d);font-size:32px;margin:0 0 4px;letter-spacing:.03em;text-transform:uppercase}
.done .proto{font-family:var(--font-d);font-size:26px;font-weight:700;letter-spacing:.06em;color:var(--primary);margin:10px 0}
.rec{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;margin-bottom:8px;cursor:pointer;text-align:left;width:100%}
.rec:hover{border-color:var(--primary)}
.rec .th{aspect-ratio:1;background:var(--surface2);border-radius:8px;overflow:hidden;border:1px solid var(--line);display:block}
.rec .th img{width:100%;height:100%;object-fit:cover;display:block}
.rec .l1{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.rec .l2{font-size:12.5px;color:var(--muted);margin-top:2px}
.pill{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px}
.pill.ret{background:var(--ret-bg);color:var(--ret)} .pill.mob{background:var(--mob-bg);color:var(--mob)}
.rec .pr{font-family:var(--font-d);letter-spacing:.04em;font-size:16px}
.rec .kg{font-family:var(--font-d);font-size:22px;font-weight:700;text-align:right;white-space:nowrap}
.rec .kg small{font-size:12px;font-family:var(--font-b);color:var(--muted);font-weight:600}
.toolbar{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.search{position:relative}
.search input{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px 10px 38px;font-size:15px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:14px;text-align:center}
.kpi .k{font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.05em}
.kpi .v{font-family:var(--font-d);font-size:32px;font-weight:700;margin-top:4px}
.kpi .v small{font-size:14px;font-family:var(--font-b);color:var(--muted)}
.chart{display:flex;gap:6px;align-items:flex-end;height:140px;padding:12px 0 4px}
.chart .day{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:4px}
.chart .bars{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;max-width:32px}
.chart .b{flex:1;border-radius:4px 4px 0 0;min-height:3px;position:relative}
.chart .b.ret{background:var(--ret)} .chart .b.mob{background:var(--mob)}
.chart .b span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;font-family:var(--font-d);color:var(--muted)}
.xl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tbl .r{text-align:right}
.tbl .mini{height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.tbl .mini i{display:block;height:100%;background:var(--primary)}
.dl{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:14px}
.dl dt{color:var(--muted);font-weight:600}
.dl dd{margin:0;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:760px;border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet .hd h3{margin:0;font-family:var(--font-d);font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.photos3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.photos3 figure{margin:0}
.photos3 img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block;cursor:zoom-in;background:var(--surface2)}
.photos3 figcaption{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:5px;text-align:center}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:12px}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.lightbox .iconbtn{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;background:rgba(0,0,0,.5)}
textarea.exp{width:100%;min-height:180px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:10px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14.5px;z-index:80;max-width:90%;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.mt{margin-top:14px}
.muted{color:var(--muted)}
.seg{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.f.auto input,.f.auto select,.f.auto textarea{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.autotag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;vertical-align:1px}
.aist{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-top:8px}
.aist.ok{color:var(--ok)} .aist.bad{color:var(--bad)} .aist.busy{color:var(--muted)}
.aist svg{width:16px;height:16px;stroke-width:3}
.spin.sm{width:16px;height:16px;border-width:2.5px}
.user-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);padding:4px 10px;border-radius:8px;font-size:12.5px;font-weight:600}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-in is-login" id="top-in">
      <div class="mark" aria-hidden="true">CP</div>
      <div class="grow">
        <h1>Controle de Aço</h1>
        <div class="sub" id="subline" style="display:none"></div>
      </div>
      <div id="top-actions" style="display:none;align-items:center;gap:8px">
        <span id="user-display" class="user-badge" style="display:none"></span>
        <button class="iconbtn" data-act="settings" aria-label="Ajustes" id="btn-settings" title="Ajustes"></button>
        <button class="iconbtn" data-act="logout" aria-label="Sair" id="btn-logout" title="Sair"></button>
      </div>
    </div>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav class="tabs" aria-label="Seções" style="display:none">
    <div class="in" id="tabs"></div>
  </nav>
</div>
<div id="layer"></div>
<div id="toast-host"></div>

<script>
(function(){
'use strict';

const IC={
 camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',

 tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/>',
 truck:'<path d="M2 6h11v10H2zM13 9h4l4 4v3h-8z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
 id:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="11" r="2.5"/><path d="M5.5 17c.5-2 2-3 3.5-3s3 1 3.5 3M15 9.5h4M15 13h4"/>',
 list:'<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 download:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
 swap:'<path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>',

   t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});},

function loadImg(file){
 return new Promise((res,rej)=>{
  const u=URL.createObjectURL(file);
  const im=new Image();
  im.onload=()=>{URL.revokeObjectURL(u);res(im);};
  im.onerror=e=>{URL.revokeObjectURL(u);rej(e);};

 });

async function processPhoto(file,key){
 let src;
 try{
  // Tenta decodificar o JPEG diretamente redimensionado na CPU/GPU nativa do Android (poupa >80% de RAM)
  src=await createImageBitmap(file,{imageOrientation:'from-image',resizeWidth:1280,resizeQuality:'medium'});
 }catch(e){
  try{src=await createImageBitmap(file,{imageOrientation:'from-image'});}catch(e2){src=await loadImg(file);}
 }
 const sw=src.width||src.naturalWidth,sh=src.height||src.naturalHeight;
 const sc=Math.min(1,1280/Math.max(sw,sh));
 const w=Math.round(sw*sc),h=Math.round(sh*sc);
 const c=document.createElement('canvas');c.width=w;c.height=h;
 const x=c.getContext('2d');
 x.drawImage(src,0,0,w,h);
 if(src.close)try{src.close()}catch(e){}
 if(src.src)src.src='';

 const fs=Math.max(13,Math.round(h*0.022)),ph=Math.round(fs*2.6),pad=Math.round(fs*0.8);
 x.fillStyle='rgba(14,26,43,0.88)';
 x.fillRect(0,h-ph,w,ph);
 x.fillStyle='#F2A900';
 x.font='700 '+fs+'px Barlow Condensed, Arial, sans-serif';
 const at=new Date();
 const label=({etiqueta:'ETIQUETA DO MATERIAL',placa:'PLACA DO CAMINHÃO',cracha:'CRACHÁ DO MOTORISTA'})[key]||'FOTO';
 x.fillText(label+' · '+OPS[S.op||'ret'].label.toUpperCase(),pad,h-ph+Math.round(fs*0.95));
 x.fillStyle='#F2F5F9';
 x.font='500 '+Math.round(fs*.88)+'px Barlow, Arial, sans-serif';
 const line2=at.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'medium'})+' · CPRT '+(S.patio?'Pátio '+S.patio:'Pátio')+((Auth.user?Auth.user.nome:S.form.controlador)?' · '+(Auth.user?Auth.user.nome:S.form.controlador):'');
 x.fillText(line2,pad,h-ph+Math.round(fs*1.75));

 // Miniatura leve para a lista de histórico (máx 96px, ~2KB)
 let thumb=null;
 try{
  const tw=Math.min(96,w),th=Math.round(tw*(h/w));
  const tc=document.createElement('canvas');tc.width=tw;tc.height=th;
  const tx=tc.getContext('2d');
  tx.drawImage(c,0,0,tw,th);
  thumb=tc.toDataURL('image/jpeg',0.6);
  tc.width=0;tc.height=0;
 }catch(e){}

 const data=c.toDataURL('image/jpeg',0.72);
 let code=null;
 if(key==='etiqueta'&&'BarcodeDetector' in window){
  try{const bd=new BarcodeDetector();const r=await bd.detect(c);if(r&&r[0]&&r[0].rawValue)code=r[0].rawValue;}catch(e){}
 }
 const raw=await new Promise(r=>c.toBlob(r,'image/jpeg',0.72));
 // Limpa buffer do canvas principal para liberar GPU/RAM
 c.width=0;c.height=0;
 return {photo:{data,w,h,at:at.toISOString(),thumb},code,raw,thumb};
}

function validate(){
 const e={},msgs=[];
 function add(k,m){e[k]=m;msgs.push(m);}
 ['etiqueta','placa','cracha'].forEach(k=>{if(!S.photos[k])add('ph-'+k,'Foto obrigatória: '+PH[k].t);});
 const f=S.form;
 if(S.prod==='cord'){
  if(!(numBR(f.diametro)>0)) add('diametro','Informe o diâmetro da cordoalha');
  if(!(numBR(f.pliq)>0)) add('pliq','Informe o peso líquido em kg');
  if(!(numBR(f.metragem)>0)) add('metragem','Informe a metragem em metros');
 }else if(S.prod==='barra'){
  if(!f.bitola) add('bitola','Selecione a bitola');
  if(!(numBR(f.compm)>0)) add('compm','Informe o comprimento da barra em metros');
  if(!(numBR(f.pliq)>0)) add('pliq','Informe o peso líquido em kg');
 }else{
  if(!f.os) add('os','Informe o número da OS');
  if(!f.bitola) add('bitola','Selecione a bitola');
  if(!(parseFloat(String(f.comp||'').replace(',','.'))>0)) add('comp','Informe o comprimento unitário em cm');
  if(!(parseInt(f.qtd,10)>0)) add('qtd','Informe a quantidade de barras');
 }
 if(!/^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/.test(f.placa||'')) add('placa','Placa inválida. Use o formato ABC1D23 ou ABC1234');
 if(!(f.motorista||'').trim()) add('motorista','Informe o nome do motorista');
 if(!(f.destino||'').trim()) add('destino','Informe '+OPS[S.op].destL.toLowerCase());
 if(!(f.autorizador||'').trim()) add('autorizador','Informe '+OPS[S.op].autL.toLowerCase());
 const ctrl=Auth.user?Auth.user.nome:(f.controlador||'').trim();
 if(!ctrl) add('controlador','Informe o nome do controlador');
 return {e,msgs};
}

   errEl.style.display='block';
   btn.disabled=false;btn.textContent='Entrar';
   return;
  }

  resetForm();

let cadUserBusy=false;
async function cadastrarUsuario(){
 if(cadUserBusy)return;
 const nome=$('#u-nome')?$('#u-nome').value.trim():'';
 const login=$('#u-login')?$('#u-login').value.trim():'';
 const senha=$('#u-senha')?$('#u-senha').value:'';
 const pode_excluir=!!($('#u-pode-excluir')&&$('#u-pode-excluir').checked);
 const pode_gerenciar_usuarios=!!($('#u-pode-gerenciar')&&$('#u-pode-gerenciar').checked);
 if(!nome||!login||!senha){toast('Preencha todos os campos.');return;}

 cadUserBusy=true;
 const btn=$('#btn-cad-user');
 if(btn){btn.disabled=true;btn.textContent='Cadastrando...';}

 try{
  const res=await fetch('/api/usuarios',{
   method:'POST',
   headers:{'content-type':'application/json','authorization':'Bearer '+Auth.token},
   body:JSON.stringify({nome,login,senha,pode_excluir,pode_gerenciar_usuarios})
  });
  const data=await res.json();
  if(!res.ok||!data.ok){toast(data.erro||'Erro ao criar usuário.');return;}
  toast('Usuário cadastrado com sucesso!');
  if($('#u-nome')) $('#u-nome').value='';
  if($('#u-login')) $('#u-login').value='';
  if($('#u-senha')) $('#u-senha').value='';
  if($('#u-pode-excluir')) $('#u-pode-excluir').checked=false;
  if($('#u-pode-gerenciar')) $('#u-pode-gerenciar').checked=false;
  carregarListaUsuarios();
 }catch(e){
  toast('Erro ao conectar ao servidor.');
 }finally{
  cadUserBusy=false;
  if(btn){btn.disabled=false;btn.innerHTML=ic('plus')+'Cadastrar Usuário';}
 }
}

async function sincronizarRegistrosComBanco(){
 if(!Auth.token)return;
 try{
  const res=await fetch('/api/registros',{
   headers:{'authorization':'Bearer '+Auth.token}
  });
  if(res.ok){
   const data=await res.json();
   if(data.registros&&Array.isArray(data.registros)){
    // Guarda apenas os 50 registros mais recentes no IndexedDB local para manter o celular ultraleve
    const recentes = data.registros.slice(0, 50);
    for(const r of recentes){
     await DB.put(r);
    }
    S.records=data.registros.slice().sort((a,b)=>a.at<b.at?1:-1);
    // Para poupar memória RAM no celular, remove referências pesadas de fotos antigas da memória ativa
    S.records.forEach(r=>{
     if(r.has_photos&&r.photos) delete r.photos;
    });
    render();
   }
  }
 }catch(e){}
}

function numBR(x){
 if(x==null||x==='')return NaN;if(typeof x==='number')return x;
 let t=String(x).trim().replace(/\s/g,'');
 if(t.indexOf(',')>-1)t=t.replace(/\./g,'').replace(',','.');
 else if(/^\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');
 return parseFloat(t);
}

function calcAny(f,prod){
 if(prod==='cord'){const kg=numBR(f.pliq),m=numBR(f.metragem);if(!(kg>0)||!(m>0))return null;return {m,kg,kgm:kg/m};}
 if(prod==='barra'){const kg=numBR(f.pliq),kgm=KGM[f.bitola],cm=numBR(f.compm);if(!(kg>0)||!kgm)return null;const m=kg/kgm;return {m,kg,kgm,nb:cm>0?m/cm:null};}
 return calc(f);
}

}

 const head=[['Protocolo',r.protocolo],['Operação',o.label],['Pátio',r.patio],['Produto',prodName(r)],['Data e hora',fdt(r.at)],['Controlador',r.controlador]];

  :barra?[['Marca',r.marca],['Material',r.material],['Bitola / aço',nf(r.bitola,1)+' mm'+(r.aco?' · '+r.aco:'')],['Comprimento da barra',r.comp?nf(r.comp/100,2)+' m':''],['Norma',r.norma],['Corrida',r.corrida],['Feixe',r.feixe],['Lote',r.lote],['Peso líquido',r.kg!=null?nf(r.kg,0)+' kg':''],[r.barrasContadas?'Barras (contadas)':'Barras (estimadas)',r.qtd],['Metros lineares',r.m!=null?nf(r.m,0)+' m':''],['Código de barras',r.cod]]
  :[['OS',r.os],['Código da etiqueta',r.cod],['CPT / CPM / DF',r.cpt],['Desenho / posição',[r.desenho,r.posicao].filter(Boolean).join(' / ')],['Elemento / CJ',[r.elemento,r.cj&&('CJ '+r.cj)].filter(Boolean).join(' · ')],['Bitola / aço',nf(r.bitola,1)+' mm'+(r.aco?' · '+r.aco:'')],['Comprimento × barras',r.comp+' cm × '+r.qtd],['Peso estimado',r.kg!=null?nf(r.kg,1)+' kg ('+nf(r.m,1)+' m)':'']];
 const tail=[['Placa',r.placa],['Motorista',r.motorista],['Empresa',r.empresa],['Crachá',r.cracha],[o.destL,r.destino],[o.autL,r.autorizador],['Observações',r.obs]];

async function lerFoto(k,raw){
 let resp;
 try{
  const headers={'content-type':'application/json'};
  if(Auth.token) headers['authorization']='Bearer '+Auth.token;
  if(Cfg.get('token')) headers['x-app-token']=Cfg.get('token');
  resp=await fetch('api/ler',{method:'POST',headers,body:JSON.stringify({tipo:k,imagem:await blobToB64(raw)})});
 }
 catch(e){throw {code:'network'};}
 if([401,403,404,503].indexOf(resp.status)>-1)throw {code:'unavailable',status:resp.status};
 if(!resp.ok)throw {code:'upstream_error',status:resp.status};

async function autofill(k,raw){
 if(S.aiOff)return;
 S.ai[k]='busy';refreshPhotos();
 try{
  const d=await lerFoto(k,raw);
  let n=0;
  if(d&&typeof d==='object'){
   if(k==='etiqueta'){
    const tt=String(d.tipo||'').toLowerCase(),tp=!tt?null:tt.indexOf('cord')>-1?'cord':tt.indexOf('barra')>-1?'barra':'aco';
    if(tp&&!S.prodManual&&tp!==S.prod){S.prod=tp;S.auto.prod=true;renderDados();}
    if(S.prod==='cord'){
     const nz=x=>{const v=numBR(x);return v>0?v:null;},dg=x=>x?(String(x).replace(/\D/g,'')||null):null;
     [['material',dg(d.material)],['descricao',d.descricao],['classe',d.classe],['diametro',nz(d.diametro)],['norma',d.norma],['ordem',dg(d.ordem)],['torcao',d.torcao?(/esq/i.test(d.torcao)?'ESQUERDA':'DIREITA'):null],['resist',d.resist],['pbruto',nz(d.pbruto)],['pliq',nz(d.pliq)],['espessura',d.espessura],['metragem',nz(d.metragem)],['re',dg(d.re)],['datafab',d.datafab],['cod',dg(d.cod)]].forEach(([f,v])=>{if(setField(f,v))n++;});
     const w2=$('#calcwrap');if(w2)w2.innerHTML=calcHtml();
    }
    if(S.prod==='barra'){
     const nz=x=>{const v=numBR(x);return v>0?v:null;},dg=x=>x?(String(x).replace(/\D/g,'')||null):null;
     const bt=d.bitola!=null?numBR(d.bitola):NaN,bk=isFinite(bt)?bt.toFixed(1):null;
     let cat=d.categoria?String(d.categoria).toUpperCase().replace(/\s/g,'').replace(/^CA-?/,'CA-'):null;
     if(cat==='CA-50'&&/50\s*S/i.test(String(d.marca||'')))cat='CA-50S';
     [['marca',d.marca],['categoria',cat],['bitola',bk&&KGM[bk]?bk:null],['compm',nz(d.comprimento)],['norma',d.norma],['corrida',d.corrida],['feixe',d.feixe?String(d.feixe).trim():null],['material',dg(d.material)],['pliq',nz(d.pliq)],['lote',d.lote],['cod',dg(d.cod)]].forEach(([f,v])=>{if(setField(f,v))n++;});
     const w3=$('#calcwrap');if(w3)w3.innerHTML=calcHtml();
    }
    if(S.prod==='aco'){
    const digits=x=>x==null?null:String(x).replace(/\D/g,'')||null;
    const bt=d.bitola!=null?Number(String(d.bitola).replace(',','.')):NaN;
    const bk=isFinite(bt)?bt.toFixed(1):null;
    const ac=d.aco?ACOS.find(a=>a===String(d.aco).toUpperCase().replace(/\s/g,'')):null;
    const cp=d.comp!=null?parseFloat(String(d.comp).replace(',','.')):NaN;
    const qt=d.qtd!=null?parseInt(d.qtd,10):NaN;
    [['os',digits(d.os)],['cod',digits(d.cod)],['cpt',(c=>CODIGOS_RE.test(c)?c:null)(d.cpt?String(d.cpt).toUpperCase().replace(/[^A-Z0-9]/g,''):'')],['desenho',d.desenho],['posicao',d.posicao],['elemento',d.elemento&&String(d.elemento).toUpperCase()],['cj',d.cj],
     ['bitola',bk&&KGM[bk]?bk:null],['aco',ac],['comp',cp>0?cp:null],['qtd',qt>0?qt:null]].forEach(([f,v])=>{if(setField(f,v))n++;});
    if(d.obs)setField('obs',String(d.obs).replace(/\s+/g,' ').trim());
    const w=$('#calcwrap');if(w)w.innerHTML=calcHtml();
    }
   }else if(k==='placa'){
    const p=d.placa?String(d.placa).toUpperCase().replace(/[^A-Z0-9]/g,''):'';
    if(/^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/.test(p)&&setField('placa',p))n++;
   }else{
    [['motorista',d.motorista],['empresa',d.empresa],['cracha',d.cracha]].forEach(([f,v])=>{if(setField(f,v&&String(v).trim()))n++;});
   }
  }
  S.ai[k]=n?'ok':'fail';
 }catch(e){
  S.ai[k]='fail';
  if(e&&e.code==='unavailable'){toast('Leitura indisponível no momento.');}
 }
 refreshPhotos();
}

async function sincronizarUsuarioLogado(){
 if(!Auth.token) return;
 try{
  const res=await fetch('/api/auth/me',{headers:{'authorization':'Bearer '+Auth.token}});
  if(res.ok){
   const data=await res.json();
   if(data.usuario){
    Auth.user=Object.assign({},Auth.user,data.usuario);
    Auth.set(Auth.token,Auth.user);
    renderTabs();
   }
  }else if(res.status===401){
   Auth.clear();
   render();
  }
 }catch(e){}
}
